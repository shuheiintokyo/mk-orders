<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- Every visual here is drawn by this file (shapes, icons, text). No images or media from the web. -->
<style>
@font-face{font-family:N;src:url(fonts/r.ttf);font-weight:400}
@font-face{font-family:N;src:url(fonts/b.ttf);font-weight:700}
@font-face{font-family:N;src:url(fonts/k.ttf);font-weight:900}
:root{--bg:#120f1a;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--tx:#fbf7f2;--mu:#b7adc4;
  --y:#FFC23D;--o:#FF8A3D;--p:#FF5C7A;--v:#C04BD8;--g:linear-gradient(90deg,#FFC23D,#FF8A3D 35%,#FF5C7A 68%,#C04BD8)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--tx);font-family:N,sans-serif}
#bg{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;width:900px;height:900px;border-radius:50%;filter:blur(140px);opacity:.33}
#waves{position:absolute;inset:0}
#dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.6px);background-size:48px 48px}
#top{position:absolute;left:80px;right:80px;top:48px;display:flex;justify-content:space-between;align-items:center;font-size:28px}
.badge{display:flex;align-items:center;gap:14px;font-weight:700;letter-spacing:.02em}
.badge i{width:46px;height:46px;border-radius:12px;background:var(--g);display:grid;place-items:center;font-style:normal;color:#1a1020;font-weight:900;font-size:22px}
.chap{color:var(--mu);font-weight:700;border:2px solid var(--line);border-radius:99px;padding:6px 22px}
#stage{position:absolute;left:120px;right:120px;top:140px;height:660px}
.scene{position:absolute;inset:0}
.a{will-change:opacity,transform}
h2{font-size:66px;font-weight:900;line-height:1.15}
h2 .ja{display:block;font-size:34px;font-weight:700;color:var(--mu);margin-top:12px}
.grad{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
#sub{position:absolute;left:0;right:0;bottom:70px;display:flex;justify-content:center}
#sub .box{max-width:1560px;background:rgba(10,8,16,.78);border:1px solid var(--line);border-radius:26px;padding:18px 40px 20px;text-align:center}
#sub .who{font-size:24px;font-weight:700;letter-spacing:.08em;margin-bottom:4px}
#sub .jp{font-size:46px;font-weight:700;line-height:1.38}
#prog{position:absolute;left:80px;right:80px;bottom:30px;height:8px;display:flex;gap:8px}
#prog div{flex:1;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}
#prog b{display:block;height:100%;background:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:34px 36px}
.ic{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.ic svg{width:50px;height:50px;stroke:var(--tx);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-size:30px;font-weight:900;width:56px;height:56px;border-radius:50%;background:var(--g);color:#1a1020;display:grid;place-items:center}
.row{display:flex;gap:36px}
.c .ic{margin:0 auto}
.mu{color:var(--mu)}
</style></head>
<body>
<div id="bg">
  <div class="blob" id="b1" style="background:#FF8A3D"></div>
  <div class="blob" id="b2" style="background:#C04BD8"></div>
  <div class="blob" id="b3" style="background:#FF5C7A"></div>
  <div id="dots"></div>
  <svg id="waves" viewBox="0 0 1920 1080"></svg>
  <svg id="motif" viewBox="0 0 1920 1080" style="position:absolute;inset:0"></svg>
</div>
<div id="top"><div class="badge"><i>MK</i><span id="series"></span></div><div class="chap" id="chap"></div></div>
<div id="stage"></div>
<div id="sub"><div class="box" id="subbox"><div class="who" id="who"></div><div class="jp" id="jp"></div></div></div>
<div id="prog"></div>
<script>
const ICON = {
  spark:'<path d="M12 3l2.2 5.3L19.5 10l-5.3 2.2L12 17.5l-2.2-5.3L4.5 10l5.3-1.7z"/><path d="M19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9z"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  database:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>',
  pen:'<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/>',
  plug:'<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v4"/>',
  server:'<rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6l8.5 7 8.5-7"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
  lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  cube:'<path d="M12 2.5l8.5 4.8v9.4L12 21.5l-8.5-4.8V7.3z"/><path d="M3.5 7.3L12 12l8.5-4.7M12 12v9.5"/>',
  printer:'<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',
  hand:'<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10.5V4a1.5 1.5 0 0 1 3 0v7M14 10.5V5.5a1.5 1.5 0 0 1 3 0V14c0 4-2.5 7-6 7-2.5 0-4-1.2-5.5-3.5L3.8 14a1.5 1.5 0 0 1 2.6-1.5L8 15"/>'
};
const icon = (n, cls='') => `<div class="ic ${cls}"><svg viewBox="0 0 24 24">${ICON[n]||ICON.spark}</svg></div>`;
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
let EP, TM, built = -1, LINE0 = [];

// appear: fade + rise once time passes t0
function ap(el, t, t0, dur=0.6, dy=30){ if(!el) return; const k = ease((t - t0)/dur); el.style.opacity = k; el.style.transform = `translateY(${(1-k)*dy}px)`; }
function lineStart(si, li){ const s = TM.scenes[si]; if(li <= 0 || !s.lines[li]) return s.start + (li<=0?0.15:9e9); return s.lines[li].start; }

function init(ep, tm){
  EP = ep; TM = tm;
  document.getElementById('series').textContent = `${ep.series} · #${ep.number}`;
  document.getElementById('prog').innerHTML = ep.scenes.map(()=>'<div><b></b></div>').join('');
  // waves: a few flowing lines in brand colours
  const cols = ['#FFC23D','#FF8A3D','#FF5C7A','#C04BD8'];
  document.getElementById('waves').innerHTML = cols.map((c,i)=>`<path id="w${i}" fill="none" stroke="${c}" stroke-opacity=".10" stroke-width="2.5"/>`).join('');
}

const BUILD = {
  headline(s){ return `<div style="padding-top:40px">
      <div class="a" id="k" style="font-size:32px;font-weight:700;color:var(--y);letter-spacing:.06em">${s.kicker}</div>
      <div class="a card" id="h" style="margin-top:30px;max-width:1500px;padding:44px 52px">
        <div style="font-size:64px;font-weight:900;line-height:1.2">${s.headline}</div>
        <div class="mu" style="font-size:36px;font-weight:700;margin-top:18px">${s.headline_ja}</div>
        <div class="mu" style="font-size:24px;margin-top:22px">${s.source}</div></div>
      <div class="a" id="tw" style="margin-top:40px;font-size:58px;font-weight:900"><span class="grad">${s.twist}</span>
        <div class="mu" style="font-size:34px;margin-top:10px">${s.twist_ja}</div></div></div>`; },
  title(s, ep){ return `<div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center">
      <div class="a" id="s1" style="font-size:36px;font-weight:700;letter-spacing:.2em;color:var(--mu)">${ep.series.toUpperCase()} · ${ep.series_ja}</div>
      <div class="a" id="s2" style="font-size:40px;font-weight:900;margin-top:26px" ><span class="num" style="display:inline-grid;width:80px;height:80px;font-size:40px">${ep.number}</span></div>
      <div class="a" id="s3" style="font-size:96px;font-weight:900;margin-top:26px;line-height:1.1"><span class="grad">${ep.title}</span></div>
      <div class="a" id="s4" style="font-size:52px;font-weight:700;margin-top:22px">${ep.title_ja}</div></div>`; },
  matrix(s){
    const col = (arr, side) => arr.map((x,i)=>`<div class="a ${side}" id="${side}${i}" style="display:flex;align-items:center;gap:22px;${side==='L'?'flex-direction:row-reverse;':''}">${icon(x.icon)}<div style="font-size:38px;font-weight:700;flex:1;text-align:${side==='L'?'right':'left'}">${x.label}</div></div>`).join('');
    return `<h2 class="a" id="hd">${s.heading}<span class="ja">${s.heading_ja}</span></h2>
      <div style="position:absolute;left:0;right:0;top:190px;height:460px">
        <svg id="wires" viewBox="0 0 1680 460" style="position:absolute;inset:0;width:1680px;height:460px"></svg>
        <div style="position:absolute;left:60px;width:300px;top:0;height:460px;display:flex;flex-direction:column;justify-content:space-around">${col(s.left,'L')}</div>
        <div style="position:absolute;left:1280px;width:340px;top:0;height:460px;display:flex;flex-direction:column;justify-content:space-around">${col(s.right,'R')}</div>
        <div class="a" id="hub" style="position:absolute;left:740px;top:170px;width:200px;height:120px;border-radius:30px;background:var(--g);display:grid;place-items:center;font-size:50px;font-weight:900;color:#1a1020">MCP</div>
        <div class="a" id="cnt" style="position:absolute;left:0;right:0;top:400px;text-align:center;font-size:44px;font-weight:900"></div>
      </div>`; },
  analogy(s){ return `<h2 class="a" id="hd">${s.heading}<span class="ja">${s.heading_ja}</span></h2>
      <div style="position:absolute;left:0;right:0;top:230px;height:300px">
        <div class="a card c" id="lb" style="position:absolute;left:60px;top:40px;width:420px;text-align:center">${icon('spark')}<div style="font-size:40px;font-weight:700;margin-top:14px">${s.left_label}</div></div>
        <div class="a card c" id="rb" style="position:absolute;right:60px;top:40px;width:420px;text-align:center">${icon('database')}<div style="font-size:40px;font-weight:700;margin-top:14px">${s.right_label}</div></div>
        <svg viewBox="0 0 1680 300" style="position:absolute;inset:0;width:1680px;height:300px">
          <path id="cl" d="M480 150 H760" stroke="#FF8A3D" stroke-width="8" stroke-linecap="round" fill="none"/>
          <path id="cr" d="M1200 150 H920" stroke="#C04BD8" stroke-width="8" stroke-linecap="round" fill="none"/>
          <g id="pl"><rect x="-80" y="-55" width="120" height="110" rx="22" fill="#FF8A3D"/><rect x="40" y="-30" width="34" height="14" rx="4" fill="#FF8A3D"/><rect x="40" y="16" width="34" height="14" rx="4" fill="#FF8A3D"/></g>
          <g id="so"><rect x="-40" y="-55" width="120" height="110" rx="22" fill="#C04BD8"/><rect x="-26" y="-30" width="30" height="14" rx="4" fill="#120f1a"/><rect x="-26" y="16" width="30" height="14" rx="4" fill="#120f1a"/></g>
          <text id="pt" x="840" y="60" text-anchor="middle" font-size="44" font-weight="900" fill="#FFC23D" font-family="N">${s.plug_label}</text>
        </svg></div>
      <div class="a" id="nt" style="position:absolute;left:0;right:0;top:580px;text-align:center;font-size:38px;font-weight:700">${s.note}<span class="mu" style="margin-left:22px;font-size:30px">${s.note_ja}</span></div>`; },
  flow(s){
    const nodes = s.nodes.map((n,i)=>`${i?`<div class="a fa" id="fa${i}" style="font-size:54px;color:var(--mu);align-self:center">→</div>`:''}<div class="a card fn c" id="fn${i}" style="flex:1;text-align:center;padding:26px 16px">${icon(n.icon)}<div style="font-size:36px;font-weight:900;margin-top:14px">${n.label}</div><div class="mu" style="font-size:26px">${n.sub}</div></div>`).join('');
    const items = s.items.map((x,i)=>`<div class="a card it" id="it${i}" style="flex:1;display:flex;gap:24px;align-items:center;padding:26px 30px">${icon(x.icon)}<div><div style="font-size:40px;font-weight:900">${x.label} <span class="mu" style="font-size:30px">${x.label_ja}</span></div><div class="mu" style="font-size:27px">${x.sub}</div></div></div>`).join('');
    return `<h2 class="a" id="hd">${s.heading}<span class="ja">${s.heading_ja}</span></h2>
      <div class="row" style="margin-top:44px;gap:18px;position:relative">${nodes}<div id="dot" style="position:absolute;top:-14px;width:28px;height:28px;border-radius:50%;background:var(--y);box-shadow:0 0 30px var(--y);opacity:0"></div></div>
      <div class="row" style="margin-top:40px;gap:28px">${items}</div>`; },
  switches(s){
    const items = s.items.map((x,i)=>`<div class="a card sw" id="sw${i}" style="display:flex;align-items:center;gap:30px;padding:16px 36px;margin-bottom:16px">${icon(x.icon)}
      <div style="flex:1"><div style="font-size:42px;font-weight:900">${x.label}</div><div class="mu" style="font-size:30px">${x.label_ja}</div></div>
      <div id="tg${i}" style="width:130px;height:66px;border-radius:40px;background:rgba(255,255,255,.15);position:relative"><div id="kn${i}" style="position:absolute;top:7px;left:7px;width:52px;height:52px;border-radius:50%;background:#fff"></div></div></div>`).join('');
    return `<h2 class="a" id="hd">${s.heading}<span class="ja">${s.heading_ja}</span></h2>
      <div style="display:flex;gap:40px;margin-top:40px;align-items:flex-start"><div style="flex:1.4">${items}</div>
      <div class="a card c" id="hm" style="flex:1;text-align:center;padding:50px 30px;margin-top:20px">${icon('hand')}<div style="font-size:40px;font-weight:900;margin-top:20px;line-height:1.35">${s.human.replace(' · ','<br><span class="mu" style="font-size:32px">')}</span></div></div></div>`; },
  cards(s){
    const cards = s.cards.map((c,i)=>`<div class="a card cd" id="cd${i}" style="flex:1;padding:38px 34px">
      <div style="display:flex;align-items:center;gap:20px">${s.numbered?`<div class="num">${i+1}</div>`:''}${icon(c.icon)}</div>
      <div style="font-size:44px;font-weight:900;margin-top:26px">${c.title}</div><div class="mu" style="font-size:30px;font-weight:700">${c.title_ja}</div>
      <div style="font-size:32px;margin-top:22px;line-height:1.4">${c.body}</div><div class="mu" style="font-size:28px;margin-top:6px">${c.body_ja}</div></div>`).join('');
    return `<h2 class="a" id="hd">${s.heading}<span class="ja">${s.heading_ja}</span></h2>
      <div class="row" style="margin-top:44px">${cards}</div>
      ${s.footer?`<div class="a" id="ft" style="margin-top:36px;text-align:center;font-size:40px;font-weight:900"><span class="grad">${s.footer}</span></div>`:''}`; },
  end(s, ep){ return `<div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center">
      <div class="a" id="e1" style="width:150px;height:150px;border-radius:40px;background:var(--g);display:grid;place-items:center;font-size:66px;font-weight:900;color:#1a1020">MK</div>
      <div class="a" id="e2" style="font-size:72px;font-weight:900;margin-top:34px">MK Production Lab</div>
      <div class="a" id="e3" class="mu" style="font-size:36px;font-weight:700;margin-top:10px;color:var(--mu)">${ep.series} · ${ep.series_ja}</div>
      <div class="a card" id="e4" style="margin-top:46px;font-size:40px;font-weight:700;padding:26px 46px">${s.next}<div class="mu" style="font-size:32px;margin-top:6px">${s.next_ja}</div></div>
      <div class="a" id="e5" style="margin-top:34px;font-size:24px;color:var(--mu)">Voices are synthetic (Kokoro TTS). Visuals made by MK Production. · 音声は合成音声です</div></div>`; }
};

const UPDATE = {
  headline(s, si, t){ ap(q('k'), t, lineStart(si,0)); ap(q('h'), t, lineStart(si,0)+0.25); ap(q('tw'), t, lineStart(si, s.twist_at)); },
  title(s, si, t){ ['s1','s2','s3','s4'].forEach((id,i)=>ap(q(id), t, lineStart(si,0)+i*0.25)); },
  matrix(s, si, t){
    ap(q('hd'), t, lineStart(si,0));
    s.left.forEach((_,i)=>ap(q('L'+i), t, lineStart(si,1)+i*0.15, .6, 0));
    s.right.forEach((_,i)=>ap(q('R'+i), t, lineStart(si,s.apps_at)+0.6+i*0.25, .6, 0));
    const hub = clamp((t - lineStart(si, s.hub_at))/1.2), wire = clamp((t - lineStart(si, s.wires_at))/1.5);
    const ly = s.left.map((_,i)=>460*(i+.5)/s.left.length), ry = s.right.map((_,i)=>460*(i+.5)/s.right.length);
    let svg = '';
    ly.forEach((a,i)=>ry.forEach((b,j)=>{ // direct wires fade out as the hub appears
      const k = clamp(wire*12 - (i*4+j)*0.6) * (1-hub);
      svg += `<path d="M366 ${a} C 760 ${a}, 900 ${b}, 1274 ${b}" stroke="#FF8A3D" stroke-opacity="${.55*k}" stroke-width="3" fill="none"/>`; }));
    if (hub>0){ ly.forEach(a=> svg += `<path d="M366 ${a} C 560 ${a}, 620 230, 740 230" stroke="#FFC23D" stroke-opacity="${.9*hub}" stroke-width="5" fill="none"/>`);
      ry.forEach(b=> svg += `<path d="M940 230 C 1060 230, 1100 ${b}, 1274 ${b}" stroke="#C04BD8" stroke-opacity="${.9*hub}" stroke-width="5" fill="none"/>`); }
    q('wires').innerHTML = svg;
    const h = q('hub'); h.style.opacity = ease(hub); h.style.transform = `scale(${.6+.4*ease(hub)})`;
    const c = q('cnt'); ap(c, t, lineStart(si, s.count_at)+1.2);
    c.innerHTML = hub>0.3 ? `<span class="grad">${s.hub_count}</span>` : s.count;
  },
  analogy(s, si, t){
    ap(q('hd'), t, lineStart(si,0)); ap(q('lb'), t, lineStart(si,0)+.2, .6, 0); ap(q('rb'), t, lineStart(si,0)+.35, .6, 0);
    const k = ease((t - lineStart(si, s.connect_at) - 0.8)/1.6);
    q('pl').setAttribute('transform', `translate(${560 + 200*k},150)`);
    q('so').setAttribute('transform', `translate(${1080 - 120*k},150)`);
    q('cl').setAttribute('d', `M480 150 H${520+200*k}`); q('cr').setAttribute('d', `M1200 150 H${1120-120*k}`);
    q('pt').setAttribute('opacity', clamp((k-.85)*7));
    ap(q('nt'), t, lineStart(si, s.note_at)+1);
  },
  flow(s, si, t){
    ap(q('hd'), t, lineStart(si,0));
    s.nodes.forEach((_,i)=>{ ap(q('fn'+i), t, lineStart(si,s.nodes_at)+.4+i*.35); if(i) ap(q('fa'+i), t, lineStart(si,s.nodes_at)+.3+i*.35, .4, 0); });
    s.items.forEach((x,i)=>ap(q('it'+i), t, lineStart(si,x.at)+i*1.6));
    const d = q('dot'), t0 = lineStart(si, s.pulse_at);
    if (t > t0){ const p = ((t - t0)/3.2) % 1; const x = p<.5 ? p*2 : 2-p*2; d.style.opacity = .95; d.style.left = `calc(${(4+x*92).toFixed(2)}% - 14px)`; } else d.style.opacity = 0;
  },
  switches(s, si, t){
    ap(q('hd'), t, lineStart(si,0));
    s.items.forEach((x,i)=>{ const t0 = lineStart(si,x.at)+i*.9; ap(q('sw'+i), t, t0);
      const k = ease((t - t0 - .7)/.5), on = x.on;
      q('kn'+i).style.left = `${7 + (on? 64*k : 0)}px`;
      q('tg'+i).style.background = k>0 ? (on ? `rgba(43,196,160,${.35+.55*k})` : `rgba(255,92,122,${.35+.55*k})`) : 'rgba(255,255,255,.15)'; });
    ap(q('hm'), t, lineStart(si, s.human_at)+1.5);
  },
  cards(s, si, t){
    ap(q('hd'), t, lineStart(si,0));
    s.cards.forEach((c,i)=>ap(q('cd'+i), t, lineStart(si,c.at) + (s.cards.filter((x,j)=>j<i && x.at===c.at).length)*1.2));
    if (s.footer) ap(q('ft'), t, lineStart(si, s.footer_at));
  },
  end(s, si, t){ ['e1','e2','e3','e4','e5'].forEach((id,i)=>ap(q(id), t, lineStart(si,0)+i*.3)); }
};
const q = id => document.getElementById(id);

// ---- Background motifs: quiet line drawings that match the topic of each section.
// Low contrast on purpose: they give a sense of place without pulling the eye from the content.
function rnd(seed){ let x = seed; return () => (x = (x * 16807) % 2147483647) / 2147483647; }
const MOTIF_FOR = { headline:'network', title:'orbit', matrix:'network', analogy:'circuit', flow:'circuit',
                    switches:'network', cards:'blueprint', end:'orbit' };
const NET = (()=>{ const r = rnd(11); return [...Array(30)].map(()=>({x:r()*1920, y:r()*1080, a:r()*6.28, s:.15+r()*.25})); })();
const MOTIF = {
  network(t){
    const P = NET.map(n=>({x:n.x+40*Math.sin(t*n.s+n.a), y:n.y+30*Math.cos(t*n.s*1.3+n.a)}));
    let g = '';
    const E = [];
    for (let i=0;i<P.length;i++) for (let j=i+1;j<P.length;j++){ const d = Math.hypot(P[i].x-P[j].x, P[i].y-P[j].y); if (d<330) E.push([i,j,d]); }
    E.forEach(([i,j,d])=> g += `<line x1="${P[i].x|0}" y1="${P[i].y|0}" x2="${P[j].x|0}" y2="${P[j].y|0}" stroke="#fff" stroke-opacity="${(.20*(1-d/330)).toFixed(3)}" stroke-width="1.5"/>`);
    P.forEach(p=> g += `<circle cx="${p.x|0}" cy="${p.y|0}" r="4.5" fill="#fff" fill-opacity=".30"/>`);
    // small data packets travelling along a few links
    E.filter((_,k)=>k%5===0).forEach(([i,j],k)=>{ const u = ((t*.25 + k*.37) % 1); const x = P[i].x+(P[j].x-P[i].x)*u, y = P[i].y+(P[j].y-P[i].y)*u;
      g += `<circle cx="${x|0}" cy="${y|0}" r="5" fill="#FFC23D" fill-opacity="${(.45*Math.sin(u*Math.PI)).toFixed(2)}"/>`; });
    return g;
  },
  circuit(t){
    const r = rnd(5); let g = '';
    for (let k=0;k<16;k++){
      const y0 = 60 + k*64, x0 = r()*400, x1 = x0 + 300 + r()*500, dy = (r()<.5?-1:1)*64*(1+Math.floor(r()*2)), x2 = x1 + 200 + r()*600;
      const d = `M${x0|0} ${y0} H${x1|0} L${(x1+Math.abs(dy))|0} ${y0+dy} H${x2|0}`;
      g += `<path d="${d}" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/><circle cx="${x2|0}" cy="${y0+dy}" r="6" fill="none" stroke="#fff" stroke-opacity=".26" stroke-width="2"/>`;
      const len = (x1-x0) + Math.abs(dy)*1.414 + (x2-x1-Math.abs(dy)), u = ((t*90 + k*137) % (len+400)) - 200;
      if (u>0 && u<len){ g += `<path d="${d}" fill="none" stroke="${k%2?'#FF8A3D':'#C04BD8'}" stroke-opacity=".5" stroke-width="3" stroke-dasharray="60 ${len+100}" stroke-dashoffset="${-u+60}"/>`; }
    }
    return g;
  },
  blueprint(t){
    let g = '';
    for (let x=0;x<=1920;x+=60) g += `<line x1="${x}" y1="0" x2="${x}" y2="1080" stroke="#8fb4ff" stroke-opacity="${x%300?.09:.17}"/>`;
    for (let y=0;y<=1080;y+=60) g += `<line x1="0" y1="${y}" x2="1920" y2="${y}" stroke="#8fb4ff" stroke-opacity="${y%300?.09:.17}"/>`;
    // slowly turning wireframe cube, bottom right (like a part in a CAD view)
    const a = t*.12, b = .55, S = 95, cx = 1745, cy = 215;
    const V = [-1,1].flatMap(x=>[-1,1].flatMap(y=>[-1,1].map(z=>[x,y,z])));
    const Pj = V.map(([x,y,z])=>{ const X = x*Math.cos(a)-z*Math.sin(a), Z = x*Math.sin(a)+z*Math.cos(a); const Y = y*Math.cos(b)-Z*Math.sin(b); return [cx+X*S*.75, cy+Y*S*.75]; });
    [[0,1],[0,2],[0,4],[3,1],[3,2],[3,7],[5,1],[5,4],[5,7],[6,2],[6,4],[6,7]].forEach(([i,j])=> g += `<line x1="${Pj[i][0]|0}" y1="${Pj[i][1]|0}" x2="${Pj[j][0]|0}" y2="${Pj[j][1]|0}" stroke="#8fb4ff" stroke-opacity=".38" stroke-width="2.5"/>`);
    // dimension line
    g += `<path d="M1660 320 H1830 M1660 310 V330 M1830 310 V330" stroke="#8fb4ff" stroke-opacity=".18" stroke-width="2"/>`;
    return g;
  },
  layers(t){
    // a part being printed layer by layer, bottom right
    let g = '', n = Math.min(17, Math.floor(t*1.5) % 26);
    for (let i=0;i<n;i++){ const w = 120 + 36*Math.sin(i/4); g += `<rect x="${1745-w/2}" y="${300-i*9}" width="${w}" height="6" rx="3" fill="#FF8A3D" fill-opacity="${(.10+.006*i).toFixed(3)}"/>`; }
    g += `<rect x="1640" y="309" width="210" height="7" rx="3" fill="#fff" fill-opacity=".12"/>`;
    return g;
  },
  orbit(t){
    let g = '';
    [220,340,470,610].forEach((R,i)=>{ g += `<circle cx="960" cy="540" r="${R}" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>`;
      const a = t*(.18 - i*.03) + i*1.7; g += `<circle cx="${960+R*Math.cos(a)|0}" cy="${540+R*Math.sin(a)|0}" r="${7-i}" fill="${['#FFC23D','#FF8A3D','#FF5C7A','#C04BD8'][i]}" fill-opacity=".5"/>`; });
    return g;
  }
};


function render(t){
  // background motion
  const B = [['b1',300,200,.05],['b2',1500,700,.037],['b3',1000,100,.043]];
  B.forEach(([id,x,y,f],i)=>{ const e=q(id); e.style.left=(x-450+260*Math.sin(t*f*2+i))+'px'; e.style.top=(y-450+180*Math.cos(t*f*2.3+i*2))+'px'; });
  for (let i=0;i<4;i++){ let d='M-20 '; for(let x=-20;x<=1940;x+=40){ const y=640+i*70+60*Math.sin(x/260 + t*.35 + i*1.3)+30*Math.sin(x/120 - t*.22 + i); d+=`${x} ${y.toFixed(1)} L`; } q('w'+i).setAttribute('d', d.slice(0,-2)); }

  let si = TM.scenes.findIndex(s => t >= s.start && t < s.end); if (si < 0) si = TM.scenes.length - 1;
  const s = EP.scenes[si], tm = TM.scenes[si];
  const mo = q('motif'); mo.innerHTML = MOTIF[s.bg || MOTIF_FOR[s.kind] || 'network'](t);
  mo.style.opacity = Math.min(clamp((t - tm.start)/1.0), clamp((tm.end - t)/.5));
  if (built !== si){
    q('stage').innerHTML = `<div class="scene">${BUILD[s.kind](s, EP)}</div>`;
    document.querySelectorAll('#stage .a').forEach(e=>{e.style.opacity=0});
    q('chap').textContent = s.chapter; built = si;
  }
  // scene fade in/out
  const sc = q('stage').firstChild; sc.style.opacity = Math.min(clamp((t - tm.start)/.4), clamp((tm.end - t)/.35));
  UPDATE[s.kind](s, si, t);

  // subtitle (Japanese, burned in)
  let li = -1; tm.lines.forEach((l,i)=>{ if (t >= l.start - .05 && t <= l.end + .25) li = i; });
  const box = q('subbox');
  if (li >= 0){ const L = s.lines[li], sp = EP.speakers[L.sp]; box.style.opacity = 1;
    q('who').textContent = sp.name; q('who').style.color = sp.color; q('jp').textContent = L.ja; box.style.borderColor = sp.color + '66'; }
  else box.style.opacity = 0;

  // chapter progress
  document.querySelectorAll('#prog b').forEach((b,i)=>{ const S = TM.scenes[i]; b.style.width = (100*clamp((t - S.start)/(S.end - S.start)))+'%'; });
}
</script></body></html>
